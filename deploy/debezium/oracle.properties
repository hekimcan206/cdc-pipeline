# Debezium Server: Oracle 23ai Free (LogMiner) -> Redpanda.
# Secrets are injected through environment variables (MicroProfile Config expands ${...}).

debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=${KAFKA_BOOTSTRAP:redpanda:9092}
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Idempotent producer with acks=all: a retried send cannot reorder or duplicate records inside a partition.
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.linger.ms=5
debezium.sink.kafka.producer.compression.type=lz4

debezium.source.connector.class=io.debezium.connector.oracle.OracleConnector
debezium.source.database.hostname=${ORACLE_HOST:oracle}
debezium.source.database.port=1521
debezium.source.database.user=c##dbzuser
debezium.source.database.password=${DBZ_PASSWORD}
debezium.source.database.dbname=FREE
debezium.source.database.pdb.name=FREEPDB1
debezium.source.topic.prefix=ora
debezium.source.table.include.list=SHOP.CUSTOMERS,SHOP.ORDERS,SHOP.ORDER_LINES
debezium.source.snapshot.mode=initial

# LogMiner tuning for a small single-instance database.
# hybrid: online catalog for speed, but mid-stream DDL (schema evolution) is still reconstructed correctly.
debezium.source.log.mining.strategy=hybrid
debezium.source.log.mining.query.filter.mode=in
debezium.source.log.mining.batch.size.default=20000
debezium.source.log.mining.sleep.time.default.ms=200
debezium.source.log.mining.sleep.time.max.ms=1000

# Hand batches to the sink every 100 ms instead of the 500 ms default: latency, not throughput, is the limit here.
debezium.source.poll.interval.ms=100
debezium.source.provide.transaction.metadata=true
debezium.source.decimal.handling.mode=string
debezium.source.include.schema.changes=false
debezium.source.tombstones.on.delete=false
debezium.source.lob.enabled=false

debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat
debezium.source.schema.history.internal.store.only.captured.tables.ddl=true

debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.console.json=false
